# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Ruby

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported: Ruby 2.7, Mongoid 8, Statesman 10
          - ruby-version: '2.7'
            mongodb-version: '5.0'
            mongoid-version: '8.0'
            statesman-version: '10.0'

          # Mid-range: Ruby 3.2, Mongoid 9, Statesman 12
          - ruby-version: '3.2'
            mongodb-version: '6.0'
            mongoid-version: '9.0'
            statesman-version: '12.0'

          # Latest: Ruby 3.4, Mongoid 9, Statesman 13
          - ruby-version: '3.4'
            mongodb-version: '7.0'
            mongoid-version: '9.0'
            statesman-version: '13.0'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false

    - name: Start MongoDB Replica Set
      uses: supercharge/mongodb-github-action@1.11.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}
        mongodb-replica-set: rs0

    - name: Install dependencies
      run: |
        bundle config set --local path 'vendor/bundle'
        bundle install --jobs 4 --retry 3
      env:
        MONGOID_VERSION: ${{ matrix.mongoid-version }}
        STATESMAN_VERSION: ${{ matrix.statesman-version }}

    - name: Wait for MongoDB to be ready
      run: |
        sleep 5
        mongosh --eval "rs.status()" || true

    - name: Run tests
      run: bundle exec rspec --format documentation
      env:
        MONGOID_VERSION: ${{ matrix.mongoid-version }}
        STATESMAN_VERSION: ${{ matrix.statesman-version }}

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.ruby-version == '3.4'
      with:
        files: coverage/.resultset.json
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop --parallel
